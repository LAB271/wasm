[package]
name = "collections_component"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wit-bindgen = { version = "0.57", default-features = false, features = ["macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
