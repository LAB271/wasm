[package]
name = "pg_guest"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true

# Allow undefined symbols (they're host imports)
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--allow-undefined"]
