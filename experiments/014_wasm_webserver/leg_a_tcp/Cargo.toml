[package]
name = "leg_a_tcp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# wasi 0.13 for preview2 sockets
wasi = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite with bundled C source (requires WASI SDK)
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
